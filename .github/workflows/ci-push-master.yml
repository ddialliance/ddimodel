name: Master commit CI

on:
  push:
    branches:
    - master

jobs:
  build:
    if: github.repository == 'ddialliance/ddimodel'
    runs-on: windows-latest

    steps:
    - name: Set build paths and short SHA
      shell: pwsh
      run: |
        $shortSha = '${{ github.sha }}'.Substring(0, 8)
        "SHORT_SHA=$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "DDI_OUTPUT_ROOT=$(Join-Path $env:RUNNER_TEMP 'ddi-lifecycle-all-outputs')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "DDI_PACKAGE_ROOT=$(Join-Path $env:RUNNER_TEMP "ddi-lifecycle-$shortSha")" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "DDI_ARCHIVE_PATH=$(Join-Path $env:RUNNER_TEMP "ddi-lifecycle-all-outputs-$shortSha.zip")" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Read model slug
      shell: pwsh
      run: |
        $slugRows = @(Import-Csv -LiteralPath 'Settings/Settings.csv' | Where-Object { $_.Key -ceq 'Slug' })
        if ($slugRows.Count -ne 1 -or $slugRows[0].Value -cnotmatch '\A[a-z][a-z0-9_]*\z') {
          throw 'Settings/Settings.csv must contain exactly one valid Slug.'
        }
        "DDI_MODEL_SLUG=$($slugRows[0].Value)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Install .NET 10
      uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: '10.0.x'

    - name: Install cogs dotnet tool
      run: dotnet tool install --global cogs

    - name: Set up python
      id: python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install python dependencies
      shell: pwsh
      env:
        COGS_PYTHON: ${{ steps.python.outputs.python-path }}
      run: |
        & $env:COGS_PYTHON -m pip install -r build/requirements.txt
        if ($LASTEXITCODE -ne 0) { throw "Python dependency installation failed with exit $LASTEXITCODE" }
        "COGS_PYTHON=$env:COGS_PYTHON" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append


    - name: Install Graphviz 16.1 or newer
      shell: pwsh
      run: |
        .\build\test-graphviz.ps1
        $dot = .\build\install-dependencies.ps1
        "COGS_DOT=$dot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Run build-windows.bat
      run: .\build\build-windows.bat
      shell: cmd

    - name: Package outputs
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $artifacts = @(& ./build/get-published-artifacts.ps1 -Slug $env:DDI_MODEL_SLUG)
        $activeDirectories = @('xsd', 'json', 'rdf', 'uml', 'dctap', 'linkml', 'graphql', 'csharp', 'sphinx')
        $requiredFiles = @($artifacts | ForEach-Object { Join-Path $_.Directory $_.FileName })
        $requiredFiles += @(
          "linkml/$env:DDI_MODEL_SLUG.linkml.yml"
          "graphql/$env:DDI_MODEL_SLUG.graphqls"
          'csharp/Types.cs'
          'sphinx/build/dirhtml/index.html'
        )
        foreach ($directory in $activeDirectories) {
          if (-not (Test-Path -LiteralPath (Join-Path $env:DDI_OUTPUT_ROOT $directory) -PathType Container)) {
            throw "Missing output directory: $directory"
          }
        }
        foreach ($file in $requiredFiles) {
          if (-not (Test-Path -LiteralPath (Join-Path $env:DDI_OUTPUT_ROOT $file) -PathType Leaf)) {
            throw "Missing expected output: $file"
          }
        }
        if ((Test-Path -LiteralPath $env:DDI_PACKAGE_ROOT) -or (Test-Path -LiteralPath $env:DDI_ARCHIVE_PATH)) {
          throw 'Package and archive destinations must be new paths to avoid retaining stale artifacts.'
        }
        New-Item -ItemType Directory -Path $env:DDI_PACKAGE_ROOT | Out-Null
        foreach ($directory in ($artifacts.Directory | Select-Object -Unique)) {
          New-Item -ItemType Directory -Path (Join-Path $env:DDI_PACKAGE_ROOT $directory) | Out-Null
        }
        foreach ($artifact in $artifacts) {
          $relativePath = Join-Path $artifact.Directory $artifact.FileName
          Copy-Item -LiteralPath (Join-Path $env:DDI_OUTPUT_ROOT $relativePath) `
            -Destination (Join-Path $env:DDI_PACKAGE_ROOT $relativePath)
        }
        Push-Location $env:DDI_OUTPUT_ROOT
        try {
          & 7z a -tzip $env:DDI_ARCHIVE_PATH @activeDirectories
          if ($LASTEXITCODE -ne 0) { throw "Output archiving failed with exit $LASTEXITCODE" }
        }
        finally {
          Pop-Location
        }

    - name: Make all outputs artifact
      uses: actions/upload-artifact@v7.0.1
      with:
          name: ddi-lifecycle-all-outputs-${{env.SHORT_SHA}}
          path: ${{ env.DDI_ARCHIVE_PATH }}

    - name: Make package artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ddi-lifecycle-${{env.SHORT_SHA}}
        path: ${{ env.DDI_PACKAGE_ROOT }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6.3.0
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1 

    - name: Sync S3 dev bucket
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $artifacts = @(& ./build/get-published-artifacts.ps1 -Slug $env:DDI_MODEL_SLUG)
        foreach ($artifact in $artifacts) {
          $relativePath = Join-Path $artifact.Directory $artifact.FileName
          if (-not (Test-Path -LiteralPath (Join-Path $env:DDI_PACKAGE_ROOT $relativePath) -PathType Leaf)) {
            throw "Missing published artifact: $relativePath"
          }
        }
        $documentation = Join-Path $env:DDI_OUTPUT_ROOT 'sphinx/build/dirhtml'
        if (-not (Test-Path -LiteralPath (Join-Path $documentation 'index.html') -PathType Leaf)) {
          throw 'Missing built Sphinx documentation.'
        }
        function Invoke-Aws {
          & aws @args
          if ($LASTEXITCODE -ne 0) { throw "AWS command failed with exit $LASTEXITCODE" }
        }
        Invoke-Aws s3 sync $documentation s3://docs.ddialliance.org/DDI-Lifecycle/dev/model
        foreach ($artifact in $artifacts) {
          $source = Join-Path $env:DDI_PACKAGE_ROOT (Join-Path $artifact.Directory $artifact.FileName)
          $destination = "s3://docs.ddialliance.org/DDI-Lifecycle/dev/output/$($artifact.FileName)"
          Invoke-Aws s3 cp $source $destination --content-type $artifact.ContentType
        }
        Invoke-Aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths '/DDI-Lifecycle/dev/*'

